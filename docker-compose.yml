name: shortlink-infra

services:
  mysql:
    image: mysql:8.0
    container_name: shortlink-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-link}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --lower-case-table-names=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - shortlink-mysql-data:/var/lib/mysql
      - ./resources/database/link.sql:/docker-entrypoint-initdb.d/01-link.sql:ro
      - ./resources/database/link-data.sql:/docker-entrypoint-initdb.d/02-link-data.sql:ro
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - shortlink-network

  redis:
    image: redis:7.2-alpine
    container_name: shortlink-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - shortlink-redis-data:/data
    healthcheck:
      test: redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - shortlink-network

  nacos:
    image: nacos/nacos-server:v2.1.1
    container_name: shortlink-nacos
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_CLIENT_PORT:-9849}:9849"
    volumes:
      - shortlink-nacos-data:/home/nacos/data
      - shortlink-nacos-logs:/home/nacos/logs
    healthcheck:
      test: curl -fsS http://127.0.0.1:8848/nacos/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - shortlink-network

networks:
  shortlink-network:
    name: shortlink-network

volumes:
  shortlink-mysql-data:
    name: shortlink-mysql-data
  shortlink-redis-data:
    name: shortlink-redis-data
  shortlink-nacos-data:
    name: shortlink-nacos-data
  shortlink-nacos-logs:
    name: shortlink-nacos-logs
